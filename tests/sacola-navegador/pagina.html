<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Shopee Live (réplica de teste)</title>
<style>
  body { margin: 0; font: 14px Arial, sans-serif; color: #222; background: #f5f5f5; }
  .app { display: flex; height: 100vh; }
  .lateral { width: 220px; background: #fff; padding: 12px; }
  .ferramenta { position: relative; height: 72px; margin-bottom: 8px; border: 1px solid #eee; border-radius: 6px; display: flex; align-items: center; gap: 8px; padding: 0 10px; cursor: pointer; color: #333; }
  .icone { width: 28px; height: 28px; color: #ee4d2d; }
  .btn-lista { position: absolute; right: 6px; bottom: 6px; background: #ee4d2d; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
  .video { flex: 1; background: #111; color: #666; display: flex; align-items: center; justify-content: center; }
  .painel { position: fixed; left: 240px; top: 20px; width: 420px; height: 700px; background: #fff; border: 1px solid #ddd; padding: 12px; overflow: auto; }
  .painel-head, .dlg-head { display: flex; justify-content: space-between; align-items: center; }
  .x { cursor: pointer; font-size: 20px; padding: 0 6px; }
  .linha { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .dialog { width: 980px; height: 680px; background: #fff; border-radius: 8px; display: flex; flex-direction: column; padding: 16px; box-sizing: border-box; }
  .dlg-body { flex: 1; display: flex; gap: 12px; overflow: hidden; }
  .abas { width: 200px; }
  .aba { padding: 10px; cursor: pointer; color: #333; }
  .aba--ativa { color: #ee4d2d; background: #fff4f1; font-weight: bold; }
  .conteudo { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .campo { height: 32px; margin-bottom: 10px; padding: 0 8px; }
  .grid { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(4, 170px); gap: 12px; align-content: start; }
  .fav-card { position: relative; width: 170px; height: 250px; border: 1px solid #e5e5e5; border-radius: 4px; box-sizing: border-box; padding: 6px; background: #fff; }
  .fav-card--selected { border-color: #ee4d2d; }
  .fav-card--hover { box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .fav-chk { position: absolute; left: 8px; top: 8px; z-index: 2; }
  .fav-img { height: 150px; background: #ddd; }
  .fav-nome { height: 36px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 12px; margin-top: 4px; }
  .fav-preco { color: #ee4d2d; margin-top: 4px; }
  .spin-carregando { position: absolute; right: 8px; top: 8px; width: 16px; height: 16px; border: 2px solid #ee4d2d; border-top-color: transparent; border-radius: 50%; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 16px; border-radius: 4px; z-index: 9999; }
  .fav-ver { position: absolute; bottom: 4px; left: 4px; right: 4px; background: #333; color: #fff; text-align: center; font-size: 11px; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 10px; align-items: center; padding-top: 10px; }
  .contador { margin-right: auto; color: #666; }
  .btn { height: 32px; padding: 0 14px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; }
  .btn--pri { background: #ee4d2d; color: #fff; border-color: #ee4d2d; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  /* Ant Design */
  .ant-checkbox-wrapper { display: inline-flex; cursor: pointer; }
  .ant-checkbox { position: relative; display: inline-block; width: 16px; height: 16px; }
  .ant-checkbox-input { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .ant-checkbox-inner { position: relative; display: block; width: 16px; height: 16px; box-sizing: border-box; border: 1px solid #d9d9d9; border-radius: 2px; background: #fff; }
  .ant-checkbox-checked .ant-checkbox-inner { background: #ee4d2d; border-color: #ee4d2d; }
  .ant-checkbox-inner::after { content: " "; position: absolute; opacity: 0; }
  .ant-checkbox-checked .ant-checkbox-inner::after { opacity: 1; }
  /* desenhado */
  .shp-checkbox { width: 18px; height: 18px; border: 1px solid #999; background: #fff; border-radius: 2px; }
  .shp-checkbox--checked { background: #ee4d2d; border-color: #ee4d2d; }
  .chk-box { display: block; width: 18px; height: 18px; border: 1px solid #999; background: #fff; cursor: pointer; }
  .chk-box--on { background: #ee4d2d; }
  .md-check { position: relative; display: block; width: 18px; height: 18px; border: 1px solid #999; background: #fff; }
  .md-check--on { background: #ee4d2d; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/__teste/react.js"></script>
<script src="/__teste/react-dom.js"></script>
<script src="/__teste/app.js"></script>
</body>
</html>
